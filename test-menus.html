<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BNG Menu Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 24px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    #status { color: #666; margin-bottom: 24px; font-size: 0.9rem; }

    .category { margin-bottom: 32px; }
    .category-name {
      font-size: 1.2rem; font-weight: bold;
      border-bottom: 2px solid #333; padding-bottom: 6px; margin-bottom: 12px;
    }
    .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .item-card {
      background: #fff; border-radius: 8px; padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .item-name { font-weight: bold; margin-bottom: 4px; }
    .item-price { color: #2a7a2a; font-size: 0.95rem; }

    .error { color: red; }
    pre {
      background: #f0f0f0; padding: 12px; border-radius: 6px;
      font-size: 0.78rem; overflow: auto; margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>BNG Menu (by Category)</h1>
  <div id="status">Loading...</div>
  <div id="content"></div>

  <script>
    fetch('http://localhost:8080/api/menu')
      .then(r => r.json())
      .then(json => {
        const status  = document.getElementById('status');
        const content = document.getElementById('content');

        if (!json.success) {
          status.innerHTML = `<span class="error">Error: ${json.message}</span>`;
          const raw = document.createElement('pre');
          raw.textContent = JSON.stringify(json, null, 2);
          content.appendChild(raw);
          return;
        }

        const categories = json.data?.categories ?? [];
        const totalItems = json.data?.totalItems ?? 0;

        if (categories.length === 0) {
          status.textContent = 'No categories returned from Clover.';
          return;
        }

        status.textContent = `${categories.length} categories · ${totalItems} items`;

        categories.forEach(cat => {
          const section = document.createElement('div');
          section.className = 'category';

          const heading = document.createElement('div');
          heading.className = 'category-name';
          heading.textContent = cat.name + (cat.items?.length ? ` (${cat.items.length})` : '');
          section.appendChild(heading);

          const grid = document.createElement('div');
          grid.className = 'items';

          (cat.items ?? []).forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
              <div class="item-name">${item.name ?? '(unnamed)'}</div>
              <div class="item-price">$${(item.price ?? 0).toFixed(2)}</div>
            `;
            grid.appendChild(card);
          });

          section.appendChild(grid);
          content.appendChild(section);
        });
      })
      .catch(err => {
        document.getElementById('status').innerHTML =
          `<span class="error">Fetch failed: ${err.message} — is the backend running on port 8080?</span>`;
      });
  </script>
</body>
</html>
